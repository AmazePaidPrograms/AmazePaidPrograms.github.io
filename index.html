<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amaze Paid Programs</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#0b0f19;
            color:white;
        }

        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px;
            background:#111827;
        }

        .logo{
            font-size:24px;
            font-weight:bold;
            color:#4da3ff;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:15px;
        }

        .hero{
            text-align:center;
            padding:70px 20px;
        }

        .hero h1{
            font-size:38px;
            margin-bottom:15px;
        }

        .hero p{
            color:#cfcfcf;
            margin-bottom:30px;
        }

        .buttons a{
            display:inline-block;
            margin:8px;
            padding:14px 25px;
            border-radius:10px;
            text-decoration:none;
            font-weight:bold;
        }

        .apps{
            background:#4da3ff;
            color:white;
        }

        .games{
            border:2px solid #4da3ff;
            color:#4da3ff;
        }

        .section{
            padding:25px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:15px;
        }

        .card{
            background:#161b22;
            padding:20px;
            border-radius:15px;
        }

        footer{
            text-align:center;
            padding:30px;
            color:#888;
        }
    </style>

</head>

<body>

<header>

<div class="logo">
AMAZE
</div>

<a href="#">Home</a>

Premium Apps • Modded Games • Wallpapers • Icons
</p>

<div class="buttons">

<a class="games" href="#">Browse Games</a>
</div>

</section>

<section class="section">

<h2>Featured Apps</h2>

<div class="cards">

<div class="card">
<h3>CapCut Pro</h3>
<p>Latest Version</p>
</div>

<div class="card">
